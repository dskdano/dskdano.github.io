<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D4N0NEK CREW</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --transition-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes bounceIn {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .fadeIn { animation: fadeIn 1s ease-out forwards; }
        .bounceIn { animation: bounceIn 2s ease-in-out infinite; }

        .main-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .main-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .main-header h1 {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-color);
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .links-section {
            width: 100%;
            max-width: 400px;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 16px 20px;
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
            border-radius: 6px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            transition: transform var(--transition-speed), background-color var(--transition-speed), color var(--transition-speed);
        }

        .btn:hover {
            transform: scale(1.04);
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .btn-secondary {
            border-color: #ffffff90;
            color: #ffffff90;
        }

        .btn-secondary:hover {
            border-color: var(--text-color);
            color: var(--bg-color);
        }

        .info-panel {
            width: 100%;
            max-width: 400px;
            background-color: #111111;
            padding: 25px;
            border-radius: 6px;
            border: 1px solid #333333;
            margin-bottom: 40px;
        }

        .info-panel h2 {
            font-size: 1.4rem;
            font-weight: 700;
            border-bottom: 2px solid var(--text-color);
            display: inline-block;
            padding-bottom: 5px;
            text-transform: uppercase;
        }

        .main-footer {
            margin-top: auto;
            text-align: center;
            padding-top: 30px;
            font-size: 0.9rem;
            color: #666666;
        }
    </style>
</head>
<body>
    <div class="main-container fadeIn">
        <header class="main-header">
            <h1>D4N0NEK CREW</h1>
        </header>

        <div class="links-section">
            <a href="https://discord.gg/F48f4TyXw5" target="_blank" class="btn bounceIn">
                D4N0NEK COMMUNITY
            </a>
            <a href="https://discord.gg/46z4WthKu" target="_blank" class="btn btn-secondary">
                DSK TEAM
            </a>
        </div>

        <h2 class="section-title">YouTube</h2>
        <div class="links-section">
            <a href="https://www.youtube.com/@danonekYT4" target="_blank" class="btn btn-secondary">
                D4N0NEK
            </a>
            <a href="https://www.youtube.com/@adminkubbrok" target="_blank" class="btn btn-secondary">
                Kubrok
            </a>
            <a href="https://www.youtube.com/@siwiasty_fivem" target="_blank" class="btn btn-secondary">
                Siwiasty
            </a>
        </div>

        <div class="info-panel">
            <h2>OGŁOSZENIA</h2>
        </div>

        <footer class="main-footer">
            &copy; 2026 D4N0NEK CREW. Wszystkie prawa zastrzeżone.
        </footer>
    </div>
</body>
</html>
