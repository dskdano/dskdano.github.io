<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D4N0NEK CREW</title>
    <style>
        :root {
            --bg: #050505;
            --card-bg: #111111;
            --text: #ffffff;
            --text-muted: #888888;
            --border: #222222;
            --accent: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-tabs {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 5px;
            gap: 5px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: #000000;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .tab-content.active {
            display: flex;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .link-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            background-color: #1a1a1a;
        }

        .link-card::after {
            content: '→';
            font-size: 1.2rem;
            transition: transform 0.2s ease;
        }

        .link-card:hover::after {
            transform: translateX(4px);
        }

        .announcements {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
        }

        .announcements h2 {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .announcements p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>D4N0NEK CREW</h1>
        </header>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('discord', this)">Discord</button>
            <button class="tab-btn" onclick="switchTab('youtube', this)">YouTube</button>
        </div>

        <div id="discord" class="tab-content active">
            <a href="https://discord.gg/F48f4TyXw5" target="_blank" class="link-card">D4N0NEK COMMUNITY</a>
            <a href="https://discord.gg/46z4WthKu" target="_blank" class="link-card">DSK TEAM</a>
        </div>

        <div id="youtube" class="tab-content">
            <a href="https://www.youtube.com/@danonekYT4" target="_blank" class="link-card">D4N0NEK</a>
            <a href="https://www.youtube.com/@adminkubbrok" target="_blank" class="link-card">Kubrok</a>
            <a href="https://www.youtube.com/@siwiasty_fivem" target="_blank" class="link-card">Siwiasty</a>
        </div>

        <div class="announcements">
            <h2>Ogłoszenia</h2>
            <p>Brak nowych ogłoszeń.</p>
        </div>

        <footer>
            &copy; 2026 D4N0NEK CREW. Wszystkie prawa zastrzeżone.
        </footer>
    </div>

    <script>
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }
    </script>
</body>
</html>
