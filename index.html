<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dskdano - Discord</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 90%;
            max-width: 320px;
        }
        .discord-btn {
            display: block;
            text-align: center;
            background-color: #5865F2;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }
        .discord-btn:hover {
            background-color: #4752C4;
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <h1>Dołącz do moich serwerów!</h1>
    <div class="btn-container">
        <a href="https://discord.gg/F48f4TyXw5" target="_blank" class="discord-btn">Serwer Discord #1</a>
        <a href="https://discord.gg/46z4WthKu" target="_blank" class="discord-btn">Serwer Discord #2</a>
    </div>
</body>
</html>
